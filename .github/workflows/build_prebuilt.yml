name: Build Prebuilt Release

on:
  push:
    branches:
      - mads-resume-longitude-enabled
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build'
        required: false
        default: 'mads-resume-longitude-enabled'

env:
  BUILD_BRANCH: mads-resume-longitude-enabled
  PREBUILT_BRANCH: mads-resume-longitude-enabled-prebuilt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up QEMU (for aarch64 cross-compilation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build in Docker (aarch64)
        run: |
          # Create output directory with proper permissions
          mkdir -p ${{ github.workspace }}/output
          chmod 777 ${{ github.workspace }}/output

          # Build the project inside an aarch64 container
          docker buildx build \
            --platform linux/arm64 \
            --load \
            -t openpilot-builder:latest \
            -f Dockerfile.openpilot .

          # Run the build inside the container
          docker run --platform linux/arm64 --rm \
            -v ${{ github.workspace }}/output:/output \
            openpilot-builder:latest \
            /bin/bash -c "
              cd /home/batman/openpilot && \
              scons -j\$(nproc) --minimal && \
              scons -j\$(nproc) panda/ && \
              find . -name '*.a' -delete && \
              find . -name '*.o' -delete && \
              find . -name '*.os' -delete && \
              find . -name '*.pyc' -delete && \
              find . -name 'moc_*' -delete && \
              find . -name '__pycache__' -delete && \
              rm -rf .git .sconsign.dblite Jenkinsfile release/ && \
              rm -f selfdrive/modeld/models/*.onnx && \
              rm -f sunnypilot/modeld*/models/*.onnx && \
              find third_party/ -name '*x86*' -exec rm -r {} + || true && \
              find third_party/ -name '*Darwin*' -exec rm -r {} + || true && \
              touch prebuilt && \
              cp -r . /output/ && \
              chmod -R 777 /output
            "

      - name: Push prebuilt branch
        run: |
          cd ${{ github.workspace }}/output

          # Get version info
          VERSION=$(awk -F\" '{print $2}' sunnypilot/common/version.h)
          GIT_HASH=${{ github.sha }}
          DATETIME=$(date '+%Y-%m-%dT%H:%M:%S')

          # Set up git
          git init
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # Set up remote with token
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

          # Create orphan branch and push
          git checkout --orphan ${{ env.PREBUILT_BRANCH }}
          git add -f .
          git commit -m "sunnypilot v${VERSION} prebuilt
          version: sunnypilot v${VERSION}
          date: ${DATETIME}
          source commit: ${GIT_HASH}
          source branch: ${{ env.BUILD_BRANCH }}
          "

          git push -f origin ${{ env.PREBUILT_BRANCH }}

          echo "✅ Prebuilt branch pushed: ${{ env.PREBUILT_BRANCH }}"
          echo "📱 Install URL: https://installer.comma.ai/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ env.PREBUILT_BRANCH }}"
